name: PanelCare quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
        if: hashFiles('package-lock.json') != ''
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        if: hashFiles('package-lock.json') == ''
      - name: Harness structural validation
        run: node scripts/harness.mjs validate
      - name: Branch and file ownership check
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/harness.mjs check --base origin/main
      - name: App quality checks
        run: node scripts/ci.mjs
